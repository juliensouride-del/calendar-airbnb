# ============================================================================
#  Configuración (sin secretos: van en los Secrets del repositorio de GitHub)
#    YAHOO_USUARIO, YAHOO_CLAVE_APP, GOOGLE_SERVICE_ACCOUNT_JSON, CALENDAR_ID, GEMINI_API_KEY,
#    ALERTA_EMAIL, ALERTA_NTFY_TOPIC (y *_PRUEBAS para el entorno de pruebas). Ver README.
# ============================================================================

[yahoo]
# Carpetas IMAP que se revisan. "INBOX" = Bandeja de entrada; "Archive" = Archivo (si Julien
# archiva un correo antes de que pase el script, cada 2 h de día, no se pierde; un correo
# que ya se procesó en INBOX y se archiva después no se repite). Si algún correo de Airbnb
# cae en Spam añade "Bulk". Una carpeta que no existe se omite (aviso en el log).
carpetas = ["INBOX", "Archive"]
# Dominios o direcciones de los remitentes de Airbnb.
remitentes = ["airbnb.com"]
# Días hacia atrás que revisa cada ejecución, contados desde la última ejecución que terminó bien
# (si la automatización estuvo caída una semana, al volver recupera esa semana).
ventana_dias = 3
# Fecha (yyyy-mm-dd) desde la que se procesan correos. "" = desde la primera ejecución
# (no se cargan reservas antiguas).
procesar_desde = ""

[calendario]
# Google Calendar → Configuración del calendario → Integrar el calendario → ID del calendario.
# El calendario debe estar compartido con el email de la cuenta de servicio
# ("Hacer cambios en eventos").
id = "PEGA_AQUI_EL_ID_DEL_CALENDARIO"
zona_horaria = "Europe/Madrid"
# Cada reserva son DOS eventos cortos: la ENTRADA (el día de llegada, a la hora de entrada)
# y la SALIDA (el día de salida, a la hora de salida). Cada uno dura duracion_evento_min.
# Si un huésped sale el día que entra el siguiente en el mismo piso, su salida y esa entrada
# son un solo evento (relevo), de la hora de salida a la de entrada.
duracion_evento_min = 30
# Horario estándar (salvo acuerdo expreso): nunca se entra antes ni se sale después.
# Si el huésped llega más tarde o sale antes, el evento usa su hora.
hora_entrada_por_defecto = "15:00"
hora_salida_por_defecto = "11:00"
# Si llega un mensaje de una reserva que no está en el calendario (p. ej. su confirmación es
# anterior a lo cargado), se crea el evento con lo que traiga el mensaje y una nota al final
# indicando que no se encontró la confirmación. Solo para alojamientos de esta configuración.
# false = no se crea; solo se avisa si el huésped pide algo.
crear_evento_desde_mensaje = true

[calendario.colores]
# 1 Lavanda · 2 Salvia · 3 Uva · 4 Flamenco · 5 Plátano · 6 Mandarina
# 7 Pavo real · 8 Grafito · 9 Arándano · 10 Albahaca · 11 Tomate
reserva = "10"          # eventos de entrada
alerta_limpieza = "6"   # entradas con [ALERTA LIMPIEZA / AJUSTE HORARIO]
salida = "11"           # eventos de salida
# relevo = "7"          # salida y entrada el mismo día en el mismo piso (sin esta línea, 7)
cancelada = "8"

[limpieza]
# Cuando un huésped sale el mismo día (o el anterior) en que entra el siguiente, el
# evento de entrada del que llega lleva [LIMPIEZA OK] o [ALERTA LIMPIEZA / AJUSTE HORARIO] según
# quepa la limpieza entre la salida y la entrada, dentro del horario del equipo.
duracion_min = 120
inicio = "08:00"
fin = "15:00"           # el equipo solo trabaja por la mañana

[reglas]
# Si la reserva incluye bebés, marcar la cuna como probable aunque no la pidan.
cuna_si_hay_bebes = true
# Reintentos de un correo ante errores temporales antes de darlo por fallido.
max_reintentos = 3

[avisos]
# Destinatario de los avisos. "" = la propia cuenta de Yahoo (se envían por SMTP de Yahoo).
email = ""
peticiones = true      # sofá cama, cuna y otras peticiones especiales
errores = true         # correos que no se pueden procesar: se avisa SOLO al desarrollador (secreto
                       # ALERTA_EMAIL y ntfy), nunca al anfitrión
modificaciones = true  # modificaciones de reserva (se revisan a mano)

[gemini]
# false = solo palabras clave (sin horas de llegada/salida).
usar = true
modelo = "gemini-3.5-flash-lite"
# Modelos que se prueban, en orden, si el principal falla.
modelos_respaldo = ["gemini-3.8-flash"]
# Solo Gemini 3 o posterior: cuánto "piensa" antes de responder ("" = lo del modelo).
nivel_razonamiento = "low"
timeout_s = 30

# ----------------------------------------------------------------------------
#  Alojamientos
#   nombre:             título EXACTO del anuncio (sin distinguir mayúsculas ni tildes)
#   alias:              nombre corto para el título del evento
#   id_anuncio:         nº de airbnb.com/rooms/<nº> (lo más fiable)
#   otros_nombres:      (opcional) otros títulos con los que aparece en los correos
#   direccion:          (opcional) dirección del piso: ubicación de los eventos, con mapa en Calendar
#   capacidad_sin_sofa: (opcional) personas que caben SIN abrir el sofá cama; si la
#                       reserva lo supera se marca "sofá cama" como probable
#   locker:             (opcional) enlace del locker de llaves (se añade a la descripción)
#   locker_coincide_con / locker_si_coincide: (opcional) si entra el mismo día un huésped del
#                       alojamiento con ese alias, se usa este otro locker
# ----------------------------------------------------------------------------


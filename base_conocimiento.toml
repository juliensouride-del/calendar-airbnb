# ============================================================================
#  Base de conocimiento para responder a los huéspedes
#  Fuente: "KB - Aptos Operations - Guests Interactions" (PDF del cliente).
#
#  🔒 El repositorio es PÚBLICO: aquí no va ningún dato confidencial. Lo privado
#     (red y contraseña del wifi) va como "PRIVADO" y su valor real en el secreto de
#     GitHub BASE_PRIVADA (formato: base_privada.ejemplo.toml). Para probar en local,
#     crea base_privada.toml con ese formato (está en .gitignore y no se sube).
#
#  Reglas para quien edite este archivo:
#   - Los textos son la referencia. La IA los adapta a la pregunta del huésped y los escribe en el idioma
#     de [respuestas] idioma en config.toml (español: Airbnb los traduce al huésped),
#     pero no puede añadir datos que no estén aquí.
#   - "PRIVADO" = dato que está en BASE_PRIVADA; si ese secreto falta, se trata como PENDIENTE.
#   - "PENDIENTE" = dato que falta. Mientras falte, el borrador lo marca para que lo
#     completes tú y nunca lo rellena.
#   - Erratas evidentes del original corregidas (chek → check, Liddl → Lidl…); el
#     contenido no se ha cambiado.
#   - Marcadores: {nombre} = nombre del huésped, {dia_salida} = día de salida.
# ============================================================================

version = 1

[general]
idioma_original = "en"          # casi todo está en inglés; el borrador va en el idioma de config.toml (español)
hora_entrada = "15:00"          # = config.toml
hora_salida = "11:00"
firma = ""                      # sin firma, por ahora

# ----------------------------------------------------------------------------
#  Pisos. La clave es el alias de config.toml.
# ----------------------------------------------------------------------------


# ----------------------------------------------------------------------------
#  Preguntas del huésped: qué piezas usar para responder
# ----------------------------------------------------------------------------

[[preguntas]]
id = "planta_acceso"
ejemplos = ["What floor?", "Stairs?", "Elevator?", "¿Hay ascensor?"]
usar = ["pisos.acceso"]

[[preguntas]]
id = "camas"
ejemplos = ["Bed size?", "Sleeping accommodation?", "¿Cuántas camas hay?"]
usar = ["pisos.camas"]

[[preguntas]]
id = "entrar_antes"
ejemplos = ["Can we check in early (before 15:00)?", "Can we leave our luggage?"]
usar = ["comun.flexibilidad_horario", "comun.consigna"]
# El borrador añade, solo para ti, si la limpieza lo permite (datos del calendario). La decisión es tuya.
decide_anfitrion = true

[[preguntas]]
id = "salir_despues"
ejemplos = ["Can we check out late (after 11:00)?"]
usar = ["comun.flexibilidad_horario", "comun.consigna"]
decide_anfitrion = true

[[preguntas]]
id = "llegada_tarde"
ejemplos = ["Can we check in late (after 19:00)?", "We arrive at midnight"]
usar = ["comun.checkin"]

[[preguntas]]
id = "llaves_checkin"
ejemplos = ["How do we get the keys?", "How does check-in work?", "Will someone meet us?"]
usar = ["comun.checkin"]

[[preguntas]]
id = "salida"
ejemplos = ["What do we do with the keys when we leave?", "How does check-out work?"]
usar = ["comun.instrucciones_salida"]

[[preguntas]]
id = "aeropuerto"
ejemplos = ["How do I get there from the airport?"]
usar = ["comun.aeropuerto"]

[[preguntas]]
id = "parking"
ejemplos = ["Is there parking available?", "Free parking nearby?"]
usar = ["comun.parking"]

[[preguntas]]
id = "como_llegar"
ejemplos = ["What is the exact address?", "I can't find the place"]
usar = ["pisos.como_llegar"]

[[preguntas]]
id = "wifi"
ejemplos = ["What is the wifi password?"]
usar = ["pisos.wifi"]

[[preguntas]]
id = "incidencia"
ejemplos = ["Something is broken", "There is no hot water"]
# La base solo da el esqueleto: siempre necesita que completes tú la solución.
plantilla = """
Thanks for flagging this issue. I am sorry about this inconvenience...
Let me check with ... and get back to you ...
You can find a ... in the ...."""
decide_anfitrion = true

# ----------------------------------------------------------------------------
#  Momentos de la estancia: mensajes que propone la agenda
#   dia:  checkin, checkin-1, checkout, checkout-1, mitad (o "confirmacion" / "con_bienvenida")
#   hora: hora de Madrid a partir de la que se propone (solo ese día)
#   Cuáles se proponen lo dice config.toml → [respuestas] momentos. Hoy solo mitad_estancia: el resto
#   ya lo envían los mensajes programados de Airbnb del cliente.
# ----------------------------------------------------------------------------

[[momentos]]
id = "pedir_hora_llegada"
cuando = "al confirmarse la reserva"
dia = "confirmacion"     # se propone al llegar la confirmación, no en la agenda
idioma = "es"     # el original está en español; se traduce al idioma del huésped
texto = """
Hola {nombre},
¡Gracias por tu reserva!
Nos contactaremos contigo vía WhatsApp un día antes de tu llegada para proveerte detalles sobre el check-in. Con el fin de agilizar tu check-in, indícanos por favor tu hora de llegada o número de vuelo.
A la espera de conocerte en Madrid.
Un saludo,"""

[[momentos]]
id = "dia_antes_llegada"
cuando = "un día antes de la llegada"
dia = "checkin-1"
hora = "10:00"
texto = ""            # no lo enviamos nosotros (mensajes programados de Airbnb / WhatsApp del cliente)

[[momentos]]
id = "bienvenida"
cuando = "el día de llegada, cuando el huésped ya está en el piso"
dia = "checkin"
hora = "12:00"            # se propone a esta hora; tú lo envías cuando haya llegado
# Orden: saludo, supermercado, transporte (Tirso), normas, electricidad (Tirso), actividades,
# wifi (Buenavista y Torrecilla), restaurantes, anuncio reciente (Buenavista y Torrecilla).
piezas = ["Welcome to my place {nombre}!", "pisos.supermercado", "pisos.transporte", "comun.normas",
          "pisos.electricidad", "comun.actividades", "pisos.wifi", "comun.restaurantes", "comun.anuncio_reciente"]

[[momentos]]
id = "pedir_hora_salida"
cuando = "a la llegada, si no sabemos a qué hora se van"
dia = "con_bienvenida"    # se añade al final de la bienvenida si no sabemos la hora de salida
texto = "Ah, and if you know already, can you please let us know the time you will leave the place on {dia_salida}? That would be super helpful in order to schedule the cleaning for the following guests :)"

[[momentos]]
id = "mitad_estancia"
cuando = "a mitad de estancia, si el huésped no ha escrito"
dia = "mitad"
noches_minimas = 4        # en estancias más cortas no se manda
hora = "11:00"
nota = "Personalízalo con lo que sepas de esta estancia, o descártalo si no hace falta."
# Redactado a partir del original incompleto ("Hi [Name], How are you? Wanted ... to check with you that all is ok at the place")
texto = """
Hi {nombre}! How are you?
I just wanted to check with you that everything is OK at the place. If you need anything at all, let me know :)"""
respuesta_si_todo_bien = "Great to know! Let me know if you need anything :)"

[[momentos]]
id = "dia_antes_salida"
cuando = "el día antes de la salida"
dia = "checkout-1"
hora = "10:00"
texto = """
Hello {nombre}! 😊
We hope you are enjoying Madrid and the apartment!
A quick reminder for tomorrow's check-out (before 11:00):
• You can leave the keys inside, on the table: the door locks by itself when you close it.
• Please turn off the appliances before leaving, especially the air conditioning.
If you enjoyed your stay, we would be really grateful for a review on Airbnb: it helps us a lot.
Have a safe trip, and let us know if you have any questions in the meantime!"""

[[momentos]]
id = "despedida"
cuando = "tras la salida"
dia = "checkout"
hora = "12:00"
texto = """
Thank you so much for choosing us for your stay in Madrid, {nombre}! 🙏
We hope you had a wonderful time. If you enjoyed it, we would be really grateful if you could leave a review on Airbnb: positive reviews help us a lot.
Have a safe trip home! 😊"""

normas_tirso = "To keep the space comfortable for everyone, please remember that discretion is mandatory after 11PM and smoking is not permitted. We appreciate your understanding and cooperation!"
actividades = "In terms of activities, you can go to El Retiro park, Plaza Mayor, and the Reina Sofía / Thyssen / El Prado museums."
restaurantes = """

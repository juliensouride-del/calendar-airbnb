name: Airbnb → Calendar

on:
  # Sincronización automática en pausa a petición del cliente: solo ejecuciones manuales.
  # Para reactivarla, descomentar estas líneas.
  # schedule:
  #   # Cada 2 h de día: 06:07–20:07 UTC = 08:07–22:07 en Madrid en verano (07:07–21:07 en invierno).
  #   # ≈250 min/mes de los 2 000 gratis. Minuto 7 para evitar las horas en punto, cuando GitHub va más cargado.
  #   - cron: "7 6-20/2 * * *"
  workflow_dispatch:
    inputs:
      entorno:
        description: "produccion = calendario real · pruebas = calendario de pruebas (secretos *_PRUEBAS, registro propio, avisos solo al desarrollador)"
        type: choice
        options: [produccion, pruebas]
        default: produccion
      modo:
        description: "Qué ejecutar"
        type: choice
        options: [sincronizar, recargar, comprobar, diagnosticar, recalcular-simulacion, recalcular, purgar-simulacion, purgar]
        default: sincronizar
      desde:
        description: "Solo recargar: volver a procesar los correos desde esta fecha (yyyy-mm-dd), p. ej. 6 meses atrás"
        type: string
        default: ""
      hasta:
        description: "Solo recargar: hasta esta fecha, sin incluirla (yyyy-mm-dd). Vacío = hoy"
        type: string
        default: ""
      confirmar:
        description: "Solo purgar: escribe BORRAR para eliminar TODOS los eventos creados por el script"
        type: string
        default: ""

permissions:
  contents: write          # para guardar el registro en la rama `estado` (o `estado-pruebas`)

# Las ejecuciones programadas son siempre de producción. En pruebas, el registro va en otra rama para
# que lo procesado en pruebas no se dé por procesado en producción (ni al revés).
env:
  ENTORNO: ${{ inputs.entorno || 'produccion' }}
  RAMA_ESTADO: ${{ inputs.entorno == 'pruebas' && 'estado-pruebas' || 'estado' }}

concurrency:
  group: airbnb-calendar-${{ inputs.entorno || 'produccion' }}   # nunca dos ejecuciones a la vez sobre el mismo registro
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    # Una recarga de meses puede tardar horas (Gemini limita las peticiones por minuto)
    timeout-minutes: ${{ inputs.modo == 'recargar' && 340 || 60 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar el registro de correos procesados (rama estado / estado-pruebas)
        run: |
          mkdir -p estado
          if git fetch --depth=1 origin "$RAMA_ESTADO" 2>/dev/null; then
            git show FETCH_HEAD:estado.json > estado/estado.json
            echo "ESTADO_PADRE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          else
            echo "Primera ejecución: sin registro previo."
          fi

      # continue-on-error: un fallo NO pone la ejecución en rojo, así GitHub no envía su email de
      # "failed run" (que le llegaría al propietario del repositorio). El aviso lo da el último paso.
      - name: Sincronizar
        id: sincronizar
        continue-on-error: true
        env:
          YAHOO_USUARIO: ${{ secrets.YAHOO_USUARIO }}
          YAHOO_CLAVE_APP: ${{ secrets.YAHOO_CLAVE_APP }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          ALERTA_NTFY_TOPIC: ${{ secrets.ALERTA_NTFY_TOPIC }}
          ALERTA_EMAIL: ${{ secrets.ALERTA_EMAIL }}   # avisos de errores al desarrollador (no al anfitrión)
          CALENDAR_ID_PRUEBAS: ${{ secrets.CALENDAR_ID_PRUEBAS }}
          GOOGLE_SERVICE_ACCOUNT_JSON_PRUEBAS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_PRUEBAS }}
          CONFIRMAR: ${{ inputs.confirmar }}
          MODO: ${{ inputs.modo || 'sincronizar' }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: |
          if [ "$ENTORNO" = pruebas ]; then
            # Nunca se cae a los secretos de producción: sin los de pruebas, no se ejecuta
            if [ -z "$CALENDAR_ID_PRUEBAS" ] || [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON_PRUEBAS" ]; then
              echo "::error::Faltan los secretos CALENDAR_ID_PRUEBAS y/o GOOGLE_SERVICE_ACCOUNT_JSON_PRUEBAS"; exit 1
            fi
            export CALENDAR_ID="$CALENDAR_ID_PRUEBAS" GOOGLE_SERVICE_ACCOUNT_JSON="$GOOGLE_SERVICE_ACCOUNT_JSON_PRUEBAS" PRUEBAS=1
            echo "::notice::Entorno de PRUEBAS: calendario de pruebas, registro en $RAMA_ESTADO, avisos solo al desarrollador"
          fi
          unset CALENDAR_ID_PRUEBAS GOOGLE_SERVICE_ACCOUNT_JSON_PRUEBAS
          case "$MODO" in
            comprobar)    python sincronizar.py --comprobar ;;
            diagnosticar) python sincronizar.py --diagnosticar ;;
            purgar-simulacion) python sincronizar.py --purgar --dry-run ;;
            recalcular-simulacion) python sincronizar.py --recalcular --dry-run ;;
            recalcular)   python sincronizar.py --recalcular ;;
            purgar)
              if [ "$CONFIRMAR" != "BORRAR" ]; then
                echo "::error::Para purgar escribe BORRAR en el campo confirmar. No se ha borrado nada."; exit 1
              fi
              python sincronizar.py --purgar --si ;;
            recargar)
              if [ -z "$DESDE" ]; then
                echo "::error::Para recargar indica la fecha en el campo desde (yyyy-mm-dd)."; exit 1
              fi
              python sincronizar.py --desde "$DESDE" ${HASTA:+--hasta "$HASTA"} ;;
            *)            python sincronizar.py ;;
          esac

      - name: Guardar el registro (aunque la ejecución haya fallado a medias)
        if: always()
        run: |
          [ -f estado/estado.json ] || { echo "Nada que guardar."; exit 0; }
          blob=$(git hash-object -w estado/estado.json)
          tree=$(printf '100644 blob %s\testado.json\n' "$blob" | git mktree)
          if [ -n "$ESTADO_PADRE" ] && [ "$(git rev-parse "$ESTADO_PADRE^{tree}")" = "$tree" ]; then
            echo "Registro sin cambios."; exit 0
          fi
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(git commit-tree "$tree" ${ESTADO_PADRE:+-p "$ESTADO_PADRE"} -m "Registro $(date -u +%Y-%m-%dT%H:%MZ)")
          git push origin "$commit:refs/heads/$RAMA_ESTADO"

      # Aviso de fallo SOLO al desarrollador: notificación push con https://ntfy.sh (gratis, sin cuenta).
      # Secreto ALERTA_NTFY_TOPIC = nombre de tema largo y difícil de adivinar (es la "contraseña" del canal);
      # suscríbete a ese tema en la app ntfy del móvil o en https://ntfy.sh/<tema>.
      - name: Avisar del fallo al desarrollador
        if: failure() || steps.sincronizar.outcome == 'failure'
        env:
          TOPIC: ${{ secrets.ALERTA_NTFY_TOPIC }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODO: ${{ inputs.modo || 'sincronizar' }}
        run: |
          echo "::error::La sincronización ha fallado: $URL_RUN"
          [ -n "$TOPIC" ] || { echo "Sin ALERTA_NTFY_TOPIC: no se envía aviso."; exit 0; }
          curl -fsS -H "Title: Airbnb Calendar ha fallado ($ENTORNO)" -H "Priority: high" -H "Tags: warning" \
               -H "Click: $URL_RUN" -d "Modo $MODO ($ENTORNO): $URL_RUN" "https://ntfy.sh/$TOPIC" > /dev/null \
            || echo "::warning::No se pudo enviar el aviso a ntfy"
